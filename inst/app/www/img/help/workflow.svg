<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 1100" role="img" aria-labelledby="title desc">
  <title id="title">Holomics: from sample tables to interpretable results</title>
  <desc id="desc">Load data and metadata, validate IDs and measurement scales, explore PCA, then choose DA, pairwise integration, multi-omics integration or explicit batch correction. Validate findings before exporting.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#50647a"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#20334a} .title{font-size:23px;font-weight:700}.body{font-size:18px}.small{font-size:16px}.line{stroke:#50647a;stroke-width:3;fill:none;marker-end:url(#arrow)}.box{rx:16;stroke-width:2}</style>
  </defs>
  <rect width="1320" height="1100" fill="#f7f9fc" rx="20"/>
  <rect class="box" x="310" y="24" width="700" height="120" fill="#e7f0fe" stroke="#527db5"/>
  <text x="660" y="58" text-anchor="middle" class="title">1 · Load measurements + sample metadata</text>
  <text x="660" y="90" text-anchor="middle" class="body">Omics: samples × features · Metadata: ID + Group + covariates</text>
  <text x="660" y="120" text-anchor="middle" class="small">Or use Load test data, then load its example metadata</text>
  <path class="line" d="M660 144 V176"/>
  <rect class="box" x="310" y="180" width="700" height="120" fill="#e7f0fe" stroke="#527db5"/>
  <text x="660" y="214" text-anchor="middle" class="title">2 · Check IDs, scales, missingness and design</text>
  <text x="660" y="246" text-anchor="middle" class="body">Keep raw counts separate from relative / transformed data</text>
  <text x="660" y="276" text-anchor="middle" class="small">Choose categorical covariates and reference levels; no silent ID intersection</text>
  <path class="line" d="M660 300 V332"/>
  <rect class="box" x="310" y="336" width="700" height="100" fill="#e8f5f0" stroke="#4b9478"/>
  <text x="660" y="374" text-anchor="middle" class="title">3 · Explore with PCA</text>
  <text x="660" y="408" text-anchor="middle" class="body">Check outliers and batch patterns; separation is not validation</text>
  <path d="M660 436 V475 H175 V510 M660 475 H500 V510 M660 475 H825 V510 M660 475 H1150 V510" class="line"/>
  <rect class="box" x="20" y="515" width="300" height="280" fill="#fff0e5" stroke="#c18554"/>
  <text x="170" y="550" text-anchor="middle" class="title">Adjusted associations?</text>
  <text x="42" y="590" class="body">DA / statistics</text>
  <text x="42" y="625" class="small">Continuous: lm / limma / mixed</text>
  <text x="42" y="655" class="small">Counts: DESeq2 / edgeR</text>
  <text x="42" y="685" class="small">Microbiome: MaAsLin3 / ANCOM</text>
  <text x="42" y="725" class="small">Group + covariates → preview → fit</text>
  <text x="42" y="755" class="small">Effects + FDR; check diagnostics</text>
  <rect class="box" x="345" y="515" width="300" height="280" fill="#eeeafd" stroke="#8c75bb"/>
  <text x="495" y="550" text-anchor="middle" class="title">Two linked layers?</text>
  <text x="367" y="590" class="body">Pairwise / Advanced</text>
  <text x="367" y="625" class="small">PLS / sPLS: prediction or sharing</text>
  <text x="367" y="655" class="small">rCCA: regularised association</text>
  <text x="367" y="685" class="small">Same samples in both layers</text>
  <text x="367" y="725" class="small">Scores → circle → heatmap</text>
  <text x="367" y="755" class="small">Associations are not p-values</text>
  <rect class="box" x="670" y="515" width="300" height="280" fill="#e6f5f5" stroke="#498f95"/>
  <text x="820" y="550" text-anchor="middle" class="title">Integrate many layers?</text>
  <text x="692" y="590" class="body">Multi-omics / Advanced</text>
  <text x="692" y="625" class="small">DIABLO: layers + class labels</text>
  <text x="692" y="655" class="small">Block PLS: continuous layers</text>
  <text x="692" y="685" class="small">MINT: study-aware integration</text>
  <text x="692" y="725" class="small">Scores → CIM → Circos</text>
  <text x="692" y="755" class="small">DA overview stays separate</text>
  <rect class="box" x="995" y="515" width="300" height="280" fill="#fff7dc" stroke="#b09a49"/>
  <text x="1145" y="550" text-anchor="middle" class="title">Known batch effects?</text>
  <text x="1017" y="590" class="body">Optional preprocessing</text>
  <text x="1017" y="625" class="small">ComBat: continuous measurements</text>
  <text x="1017" y="655" class="small">ComBat-seq: raw counts</text>
  <text x="1017" y="685" class="small">Specify biology to preserve</text>
  <text x="1017" y="725" class="small">Export and review corrected data</text>
  <text x="1017" y="755" class="small">Never automatic; not a DA test</text>
  <path d="M170 795 V835 H660 V865 M495 795 V835 M820 795 V835 H660 M1145 795 V835 H660" class="line"/>
  <rect class="box" x="190" y="870" width="940" height="100" fill="#e8f5f0" stroke="#4b9478"/>
  <text x="660" y="907" text-anchor="middle" class="title">4 · Review evidence and validate</text>
  <text x="660" y="942" text-anchor="middle" class="body">DA: adjusted effects + FDR · Prediction: held-out subjects / studies + fold-aware preprocessing</text>
  <path class="line" d="M660 970 V1000"/>
  <rect class="box" x="310" y="1005" width="700" height="70" fill="#e7f0fe" stroke="#527db5"/>
  <text x="660" y="1047" text-anchor="middle" class="title">5 · Export plots, tables and settings / send results to Galaxy</text>
</svg>
